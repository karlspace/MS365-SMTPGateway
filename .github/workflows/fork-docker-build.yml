# Fork Docker Build - uses the shared reusable workflow.
# Builds the three service images (relay, ui, nginx) from the workspace
# branch and publishes them to GHCR. Reference: bauer-group/automation-templates.

name: 🐳 Fork Docker Build

on:
  push:
    branches:
      - workspace
      - "workspace/**"
    paths-ignore:
      - ".github/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: fork-docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    name: Build & Push
    uses: bauer-group/automation-templates/.github/workflows/fork-docker-build.yml@main
    with:
      # Multi-image: published to ghcr.io/<owner>/<repo>/{relay,ui,nginx}.
      images: |
        [
          {"name": "relay", "dockerfile": "relay/Dockerfile"},
          {"name": "ui",    "dockerfile": "ui/Dockerfile"},
          {"name": "nginx", "dockerfile": "nginx/Dockerfile"}
        ]
    secrets: inherit
