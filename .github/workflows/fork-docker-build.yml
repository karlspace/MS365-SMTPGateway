name: Fork Docker Build

# Clean image builder for this fork. Builds the three service images
# (relay, ui, nginx) from the workspace integration branch and publishes
# them to GHCR. Upstream's own CI workflows are not used here.

on:
  push:
    branches:
      - workspace
      - "workspace/**"
    paths-ignore:
      - ".github/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: fork-docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & Push (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: relay
            dockerfile: relay/Dockerfile
          - image: ui
            dockerfile: ui/Dockerfile
          - image: nginx
            dockerfile: nginx/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=smtp-relay-${{ matrix.image }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
